<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#13251e"><title>靜心主持台</title><style>
:root{color-scheme:dark;--bg:#0d1612;--panel:#16251f;--panel2:#1d3028;--line:#385047;--text:#f4f1e9;--muted:#a9b5ae;--green:#57b77a;--gold:#d6b86c;--red:#d66c6c}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;background:radial-gradient(circle at 50% 0,#1e382d,var(--bg) 55%);color:var(--text);padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:grid;place-items:start center}.app{width:min(100%,560px)}header{text-align:center;margin:8px 0 20px}.symbol{font-size:28px;color:var(--gold);margin-bottom:5px}h1{font-size:21px;margin:0}.connection{font-size:13px;color:var(--muted);margin-top:6px}.card{background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 18px 45px #0006;margin-bottom:14px}.status{text-align:center}.status-name{font-size:13px;color:var(--muted);letter-spacing:.12em}.timer{font:500 clamp(58px,18vw,92px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.07em;margin:12px 0 8px}.progress{height:7px;border-radius:99px;background:#ffffff18;overflow:hidden}.progress>i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--green),var(--gold));transition:width .3s linear}.preset-title{font-size:13px;color:var(--muted);margin:0 0 10px}.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.custom{display:grid;grid-template-columns:1fr 90px;gap:9px;margin-top:9px}button,input{font:600 17px -apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;border-radius:11px;border:1px solid var(--line);min-height:48px}button{background:var(--panel2);color:var(--text);cursor:pointer;padding:8px}button:active{transform:scale(.98)}button.selected{background:#2c7048;border-color:var(--green)}input{background:#0d1914;color:var(--text);padding:0 12px;width:100%;text-align:center}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{background:#247a46;border-color:var(--green)}.danger{color:#ffd7d7;border-color:#734545}.wide{grid-column:1/-1}.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}.error{color:#ffb5b5}.busy{opacity:.55;pointer-events:none}@media(max-width:370px){.card{padding:14px}.presets{gap:6px}button,input{font-size:15px}}
</style></head><body><main class="app"><header><div class="symbol">◯</div><h1>靜心主持台</h1><div class="connection" id="connection">正在連線…</div></header><section class="card status"><div class="status-name" id="state">準備中</div><div class="timer" id="timer">10:00</div><div class="progress"><i id="progress"></i></div></section><section class="card"><p class="preset-title">靜心時間</p><div class="presets" id="presets"></div><div class="custom"><input id="custom" type="number" inputmode="numeric" min="1" max="999" placeholder="自訂分鐘"><button id="setCustom">設定</button></div></section><section class="card"><div class="controls"><button class="primary" id="start">開始／繼續</button><button id="toggle">暫停／繼續</button><button id="reset">重新準備</button><button class="danger" id="finish">提早結束</button></div><div class="hint">控制結果會立即同步到主持台與參與者畫面</div></section></main><script>
(()=>{const $=id=>document.getElementById(id),minutes=[3,5,7,10,15,20],labels={ready:'準備完成',running:'靜心進行中',paused:'已暫停',finished:'靜心已完成',unknown:'尚未連線'},presets=$('presets');let state={state:'unknown',remaining:0,remainingText:'--:--',selectedMinutes:10},busy=false;minutes.forEach(m=>{const b=document.createElement('button');b.textContent=m+' 分鐘';b.dataset.minutes=m;b.onclick=()=>command('/api/duration?minutes='+m);presets.appendChild(b)});function paint(){ $('timer').textContent=state.remainingText;$('state').textContent=labels[state.state]||state.state;$('connection').textContent='已連線到靜心主持台';$('connection').className='connection';const total=Math.max(1,state.selectedMinutes*60),elapsed=Math.max(0,total-state.remaining);$('progress').style.width=Math.max(0,Math.min(100,elapsed/total*100))+'%';[...presets.children].forEach(b=>b.classList.toggle('selected',Number(b.dataset.minutes)===state.selectedMinutes));document.body.classList.toggle('busy',busy)}async function request(path){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}async function command(path){if(busy)return;busy=true;paint();try{state=await request(path);paint()}catch(e){offline()}finally{busy=false;paint()}}function offline(){$('connection').textContent='無法連線，請確認 App 正在執行';$('connection').className='connection error';state.state='unknown';paint()}$('start').onclick=()=>command('/api/start');$('toggle').onclick=()=>command('/api/toggle');$('reset').onclick=()=>command('/api/reset');$('finish').onclick=()=>{if(confirm('確定要提早結束目前的靜心嗎？'))command('/api/finish')};$('setCustom').onclick=()=>{const m=Math.round(Number($('custom').value));if(m>=1&&m<=999)command('/api/duration?minutes='+m);else alert('請輸入 1–999 分鐘')};setInterval(async()=>{if(busy)return;try{state=await request('/api/state');paint()}catch(e){offline()}},500);request('/api/state').then(s=>{state=s;paint()}).catch(offline)})();
</script></body></html>
