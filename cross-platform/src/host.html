<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="common.css"><style>body{padding:12px}h1{font-size:25px;margin:4px}.timer{font:500 50px ui-monospace,monospace}.time-summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 2px}.time-summary>div{padding:7px;border:1px solid #405048;border-radius:9px;background:#ffffff08;text-align:center}.time-summary small{display:block;color:#aeb8b2;font-size:12px;margin-bottom:2px}.time-summary strong{font:600 20px ui-monospace,monospace}.panel h2{font-size:15px;color:#b8c0bb;text-align:center;margin:0 0 9px}.row{margin:7px 0}.full{width:100%}.font-select{width:100%;margin:6px 0}.preset.active,.custom-duration.active{border:4px solid #ffd400;box-shadow:0 0 0 1px #6f5f00}.address-title{margin-top:9px}.address-row{display:flex;align-items:center;justify-content:center;gap:8px;margin:5px 0}.address-row span{font:13px ui-monospace,monospace}.address-row button{padding:5px 10px}</style></head><body>
<h1 class="center">靜心主持台</h1><div class="center muted" id="status"></div><div class="timer center" id="timer">10:00</div>
<div class="time-summary"><div><small>現在時間</small><strong id="now">--:--:--</strong></div><div><small>已使用時間</small><strong id="elapsed">00:00</strong></div></div>
<button class="full" id="reminderControl">開啟時間提醒控制…</button>
<div class="panel"><h2>時間與控制</h2><div class="grid3" id="presets"></div><div class="row"><input id="custom" type="number" min="1" max="999" class="grow custom-duration" placeholder="自訂分鐘"><button id="setDuration">設定</button></div><div class="row"><button class="primary grow" id="start">開始／繼續</button><button class="grow" id="toggle">暫停／繼續</button></div><div class="row"><button class="grow" id="reset">重新準備</button><button class="grow" id="finish">提早結束</button></div><div class="muted center address-title">網頁控制</div><div id="addresses"></div></div>
<div class="panel"><h2>參與者畫面</h2><button class="full" id="toggleParticipant">隱藏參與者畫面</button>
<label><input id="showClock" type="checkbox">顯示現在時間</label><div class="row"><select id="clock24" class="grow"><option value="false">12 小時制</option><option value="true">24 小時制</option></select></div><select id="clockFont" class="font-select" aria-label="目前時間字體"><option>正在載入本機字體…</option></select><div class="row"><span>時間大小</span><input id="clockSize" type="range" min="14" max="120"><span class="value" id="clockSizeV"></span></div>
<label><input id="showText" type="checkbox">顯示主文字</label><input id="text" class="full" value="靜心練習"><select id="textFont" class="font-select" aria-label="主文字字體"><option>正在載入本機字體…</option></select><div class="row"><span>文字大小</span><input id="textSize" type="range" min="18" max="180"><span class="value" id="textSizeV"></span></div>
<label><input id="showCountdown" type="checkbox">顯示倒數</label><select id="countdownFont" class="font-select" aria-label="倒數字體"><option>正在載入本機字體…</option></select><div class="row"><span>倒數大小</span><input id="countdownSize" type="range" min="18" max="160"><span class="value" id="countdownSizeV"></span></div><div class="row"><select id="progressStyle" class="grow"><option value="ring">圓環進度</option><option value="line">直線進度</option></select></div><div class="row"><span>進度比例</span><input id="progressSize" type="range" min="8" max="40"><span class="value" id="progressSizeV"></span></div><label><input id="alwaysOnTop" type="checkbox">永遠顯示在最上層</label><p class="muted center">參與者畫面空白處可拖曳；連按兩下切換全螢幕</p></div>
<div class="panel"><h2>背景與聲音</h2><div class="row"><input id="background" type="color"><label><input id="gradient" type="checkbox">漸層</label><input id="background2" type="color"></div><button class="full" id="backgroundImage">選擇背景圖片…</button><label><input id="silent" type="checkbox">無聲模式</label><label><input id="musicEnabled" type="checkbox">使用背景音樂</label><div class="row"><select id="musicMode" class="grow"><option value="single">單首循環</option><option value="playlist">播放清單</option></select></div><div id="audio"></div></div>
<script src="host.js"></script></body></html>
