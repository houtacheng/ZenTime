<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#0d1712;color:#f5f2ea;font-family:system-ui,"Microsoft JhengHei",sans-serif}.app{max-width:760px;margin:auto}h1{text-align:center}.card{border:1px solid #385047;background:#172720;border-radius:18px;padding:18px;margin:14px 0}.timer{text-align:center;font:500 82px ui-monospace,monospace}.track{height:8px;background:#ffffff20;border-radius:9px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#57b77a,#d6b86c)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}button,input{min-height:48px;border:1px solid #476057;border-radius:11px;background:#20362d;color:#fff;font:600 17px inherit}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}.visibility{display:grid;grid-template-columns:1fr;gap:9px}.active{background:#247a46;border-color:#60bf82}.preset-selected,.custom input.preset-selected{border:4px solid #ffd400;box-shadow:0 0 0 1px #6f5f00}.custom{display:flex;gap:9px;margin-top:9px}.custom input{min-width:0;flex:1;text-align:center}.reminder-title{margin:34px 0 8px;text-align:center}.reminder-frame{display:block;width:100%;height:3000px;border:0;border-radius:18px;background:#0d1712}@media(max-width:600px){body{padding:10px}.timer{font-size:64px}.reminder-frame{height:3400px}}
</style></head><body><main class="app"><h1>靜心主持台</h1>
<div class="card"><div id="status" style="text-align:center"></div><div id="timer" class="timer">10:00</div><div class="track"><div id="fill" class="fill"></div></div></div>
<div class="card"><div id="presets" class="grid"></div><div class="custom"><input id="custom" type="number" min="1" max="999" placeholder="自訂分鐘"><button id="set">設定</button></div></div>
<div class="card controls"><button onclick="cmd('/api/start')">開始／繼續</button><button onclick="cmd('/api/toggle')">暫停／繼續</button><button onclick="cmd('/api/reset')">重新準備</button><button onclick="cmd('/api/finish')">提早結束</button></div>
<div class="card visibility"><button id="participantVisible" onclick="cmd('/api/toggle-participant')">隱藏參與者畫面</button><button id="showCountdown" onclick="cmd('/api/toggle-countdown')">倒數計時</button><button id="showClock" onclick="cmd('/api/toggle-clock')">目前時間</button><button id="showText" onclick="cmd('/api/toggle-text')">主文字</button><button id="alwaysOnTop" onclick="cmd('/api/toggle-always-on-top')">參與者畫面置頂</button></div>
<h1 class="reminder-title">時間提醒控制</h1><iframe class="reminder-frame" src="/reminder-control?embedded=1" title="完整時間提醒控制介面"></iframe>
</main><script>
const $=id=>document.getElementById(id)
for(const m of [3,5,7,10,15,20]){const b=document.createElement('button');b.dataset.minutes=m;b.textContent=m+' 分鐘';b.onclick=()=>cmd('/api/duration?minutes='+m);$('presets').append(b)}
$('set').onclick=()=>cmd('/api/duration?minutes='+$('custom').value)
async function cmd(p){await fetch(p);poll()}
async function poll(){try{const s=await fetch('/api/state',{cache:'no-store'}).then(r=>r.json());$('timer').textContent=s.remainingText;$('status').textContent={ready:'準備完成',running:'靜心進行中',paused:'已暫停',finished:'靜心已完成'}[s.status];$('fill').style.width=Math.max(0,Math.min(100,s.progress*100))+'%';const isPreset=[3,5,7,10,15,20].includes(s.selectedMinutes);for(const button of $('presets').children)button.classList.toggle('preset-selected',Number(button.dataset.minutes)===s.selectedMinutes);$('custom').classList.toggle('preset-selected',!isPreset);if(!isPreset&&document.activeElement!==$('custom'))$('custom').value=s.selectedMinutes;for(const button of $('presets').children)button.classList.toggle('preset-selected',Number(button.dataset.minutes)===s.selectedMinutes);for(const [id,key,label] of [['showCountdown','showCountdown','倒數計時'],['showClock','showClock','目前時間'],['showText','showText','主文字'],['alwaysOnTop','alwaysOnTop','參與者畫面置頂']]){$(id).classList.toggle('active',s[key]);$(id).textContent=(s[key]?'取消':'啟用')+' '+label}$('participantVisible').classList.toggle('active',s.participantVisible);$('participantVisible').textContent=s.participantVisible?'隱藏參與者畫面':'顯示參與者畫面'}catch{}}
setInterval(poll,500);poll()
</script></body></html>
