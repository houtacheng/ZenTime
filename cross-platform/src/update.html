<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>正在更新 ZenTime</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "PingFang TC", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #f5f7f4; background: #08140f; }
    main { width: min(360px, calc(100vw - 48px)); }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 0 0 22px; color: #aebdb5; line-height: 1.6; }
    .track { height: 12px; overflow: hidden; border-radius: 999px; background: #25372f; }
    .bar { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg,#33b779,#78d59f); transition: width .2s ease; }
    .meta { display: flex; justify-content: space-between; margin-top: 10px; color: #bfcbc5; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main>
    <h1>正在下載更新</h1>
    <p id="message">下載完成後會自動安裝並重新啟動，請不要關閉程式。</p>
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="meta"><span id="status">準備下載…</span><span id="percent">0%</span></div>
  </main>
  <script>
    window.zenUpdate.onProgress(data => {
      const percent = Math.max(0, Math.min(100, Number(data.percent) || 0))
      document.getElementById('bar').style.width = `${percent}%`
      document.getElementById('percent').textContent = `${Math.round(percent)}%`
      document.getElementById('status').textContent = data.status || '正在下載…'
      if (data.message) document.getElementById('message').textContent = data.message
    })
  </script>
</body>
</html>
