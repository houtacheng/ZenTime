<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>
*{box-sizing:border-box}html,body,#stage{width:100%;height:100%;margin:0;overflow:hidden;background:#000}#stage{position:relative;background-size:cover;background-position:center;color:#fff;user-select:none;-webkit-app-region:no-drag}.item{position:absolute;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;cursor:move}.clock,.countdown{font-variant-numeric:tabular-nums}.countdown{z-index:3}.text{font-weight:650;white-space:normal;width:72%;line-height:1.15}.progress{position:absolute;transform:translate(-50%,-50%);pointer-events:none}.ring{border:6px solid #ffffff24;border-radius:50%}.ring::after{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(var(--start),var(--end) calc(var(--p)*1turn),transparent 0);mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 0);transform:rotate(-90deg)}.line{height:8px;border-radius:10px;background:#ffffff24;overflow:hidden}.line::after{content:"";display:block;width:calc(var(--p)*100%);height:100%;background:linear-gradient(90deg,var(--start),var(--end))}.guide{position:absolute;display:none;pointer-events:none;border-color:#ffd400;border-style:solid;z-index:10}.guide.v{height:100%;top:0;border-width:0 0 0 1px}.guide.h{width:100%;left:0;border-width:1px 0 0}.dragging .grid{display:block}.grid{display:none;position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 24.9%,#ffffff55 25%,transparent 25.1%,transparent 49.9%,#ffffff55 50%,transparent 50.1%,transparent 74.9%,#ffffff55 75%,transparent 75.1%),linear-gradient(0deg,transparent 24.9%,#ffffff55 25%,transparent 25.1%,transparent 49.9%,#ffffff55 50%,transparent 50.1%,transparent 74.9%,#ffffff55 75%,transparent 75.1%)}
</style></head><body><div id="stage"><div class="grid"></div><div id="clock" class="item clock"></div><div id="text" class="item text"></div><div id="progress" class="progress ring"></div><div id="countdown" class="item countdown"></div></div><audio id="opening"></audio><audio id="music"></audio><audio id="closing"></audio><script src="participant.js"></script></body></html>
