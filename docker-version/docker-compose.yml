services:
  zentime:
    build: .
    image: zentime:latest
    container_name: zentime
    restart: unless-stopped
    init: true
    # host 網路讓容器可以直接掃描並控制同一區網的 WiiM Pro
    network_mode: host
    environment:
      PORT: "4747"
      DATA_DIR: /data
      # 以下四項請改成自己環境的值，留空也可以正常啟動
      # WiiM Pro 的 MAC，自動掃描時用來認出裝置；留空就接受第一台回應的 WiiM
      WIIM_MAC: ""
      # 要掃描的網段前綴，例如 192.168.1；留空會自動使用容器所在的網段
      WIIM_SCAN_PREFIX: ""
      # 已知 WiiM Pro 的 IP 時填在這裡，可以完全省掉掃描
      WIIM_HOST: ""
      # 放音檔的資料夾網址，例如 http://192.168.1.100:8088/ZenTime/music/
      MEDIA_BASE_URL: ""
      TZ: Asia/Taipei
    volumes:
      - ./data:/data
    # NAS 長期執行，限制 log 大小避免吃掉磁碟
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
