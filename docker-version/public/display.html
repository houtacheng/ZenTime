<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZenTime 參與者畫面</title><style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}#stage{position:relative;width:100%;height:100%;background:#000 center/cover no-repeat;user-select:none}.object{position:absolute;transform:translate(-50%,-50%);color:#fff;white-space:pre-wrap;text-align:center;cursor:grab}.object:active{cursor:grabbing}#text{font-weight:700;max-width:80%}#clock,#countdown{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;white-space:nowrap}.progress{position:absolute;transform:translate(-50%,-50%)}.ring{border-radius:50%;background:conic-gradient(from 0deg,var(--start) calc(var(--progress)*1turn),#ffffff20 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 9px),#000 0);mask:radial-gradient(farthest-side,transparent calc(100% - 9px),#000 0)}.line{height:12px;border-radius:99px;background:#ffffff20;overflow:hidden}.line:after{content:"";display:block;width:calc(var(--progress)*100%);height:100%;background:linear-gradient(90deg,var(--start),var(--end));border-radius:inherit}.hint{position:fixed;left:10px;bottom:8px;color:#ffffff35;font:12px system-ui;pointer-events:none}</style></head><body><div id="stage"><div id="clock" class="object"></div><div id="text" class="object"></div><div id="progress" class="progress"></div><div id="countdown" class="object"></div><div class="hint">連按兩下切換全螢幕；可拖曳三個文字物件</div></div><script src="display.js"></script></body></html>
