<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZenTime 主持台</title><link rel="stylesheet" href="common.css"></head><body><main class="wrap">
<header class="center"><h1>ZenTime 主持台</h1><div id="status" class="status">準備完成</div><div id="remaining" class="timer">10:00</div><div class="grid grid2"><div class="panel"><span class="muted">現在時間</span><h2 id="now">--:--:--</h2></div><div class="panel"><span class="muted">已使用時間</span><h2 id="elapsed">00:00</h2></div></div></header>
<section class="panel"><h2>時間與控制</h2><div id="presets" class="grid grid3"></div><div class="row"><input id="custom" class="custom grow" type="number" min="1" max="999" placeholder="自訂分鐘"><button id="setDuration">設定</button></div><div class="grid grid2"><button id="start" class="primary">開始／繼續</button><button id="toggle">暫停／繼續</button><button id="reset">重新準備</button><button id="finish" class="danger">提早結束</button></div></section>
<section class="panel"><h2>開啟畫面</h2><div class="links"><a href="/display" target="_blank">參與者畫面</a><a href="/reminder?mode=timed" target="_blank">定時提醒畫面</a><a href="/reminder?mode=temporary" target="_blank">臨時提醒畫面</a><a href="/reminder?mode=marquee" target="_blank">跑馬燈畫面</a><a href="/reminder?mode=image" target="_blank">圖片提醒畫面</a><a href="/control" target="_blank">手機控制</a></div></section>
<section class="panel"><h2>參與者畫面</h2><div class="grid grid2"><label><input id="showClock" type="checkbox"> 顯示現在時間</label><label><input id="clock24" type="checkbox"> 24 小時制</label><label><input id="showText" type="checkbox"> 顯示主文字</label><label><input id="showCountdown" type="checkbox"> 顯示倒數</label></div><div class="field"><label>主文字</label><input id="text"></div><div class="grid grid2"><div class="field"><label>主文字字體</label><input id="textFont" list="fonts"><datalist id="fonts"></datalist></div><div class="field"><label>倒數字體</label><input id="countdownFont" list="fonts"></div></div><div class="grid grid2"><div class="field"><label>主文字大小</label><input id="textSize" type="number" min="12" max="300"></div><div class="field"><label>倒數大小</label><input id="countdownSize" type="number" min="12" max="300"></div></div><div class="row"><label>背景一</label><input id="background" type="color"><label>背景二</label><input id="background2" type="color"><label><input id="gradient" type="checkbox"> 漸層</label></div><div class="field"><label>背景圖片網址</label><input id="backgroundImage" placeholder="https://..."></div><div class="grid grid2"><div class="field"><label>進度樣式</label><select id="progressStyle"><option value="ring">圓環</option><option value="line">直線</option></select></div><div class="field"><label>圓環／直線比例</label><input id="progressSize" type="number" min="8" max="50"></div></div><button id="saveVisual" class="primary">儲存畫面設定</button></section>
<section class="panel"><h2>WiiM Pro 與聲音</h2><p id="wiimStatus" class="muted">尚未連線</p><div class="grid grid2"><div class="field"><label>WiiM IP（可留空自動尋找）</label><input id="wiimHost" placeholder="例如 10.43.50.120"></div><div class="field"><label>WiiM MAC</label><input id="wiimMac"></div></div><div class="row"><button id="discover">自動尋找 WiiM</button><button id="testWiim">測試連線</button></div><label><input id="silent" type="checkbox"> 無聲模式</label>　<label><input id="musicEnabled" type="checkbox"> 使用背景音樂</label><div class="field"><label>開頭磬聲網址</label><input id="openingUrl"></div><div class="grid grid2"><div class="field"><label>開頭音量</label><input id="openingVolume" type="number" min="0" max="100"></div><div class="field"><label>磬聲長度（秒，之後開始背景音樂）</label><input id="openingDuration" type="number" min="0" max="120"></div></div><div class="field"><label>背景音樂網址（播放清單每行一首）</label><textarea id="musicUrls"></textarea></div><div class="grid grid2"><div class="field"><label>背景模式</label><select id="musicMode"><option value="single">單首循環</option><option value="playlist">播放清單</option></select></div><div class="field"><label>背景音量</label><input id="musicVolume" type="number" min="0" max="100"></div></div><div class="field"><label>結尾磬聲網址</label><input id="closingUrl"></div><div class="field"><label>結尾音量</label><input id="closingVolume" type="number" min="0" max="100"></div><button id="saveAudio" class="primary">儲存 WiiM 與聲音設定</button></section>
<section class="panel"><h2>完整時間提醒控制</h2><iframe src="/reminder-control?embedded=1" title="完整時間提醒控制介面" style="display:block;width:100%;height:3000px;border:0;border-radius:14px;background:#0d1712"></iframe></section>
</main><script src="host.js"></script></body></html>
