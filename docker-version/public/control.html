<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZenTime 控制</title><link rel="stylesheet" href="common.css"></head><body><main class="wrap"><header class="center"><h1>ZenTime</h1><div id="status" class="status">連線中</div><div id="remaining" class="timer">10:00</div><div class="muted">已使用 <span id="elapsed">00:00</span></div></header><section class="panel"><div id="presets" class="grid grid3"></div><div class="row"><input id="custom" class="custom grow" type="number" min="1" max="999" placeholder="自訂分鐘"><button id="set">設定</button></div></section><section class="panel grid grid2"><button class="primary" data-command="start">開始／繼續</button><button data-command="toggle">暫停／繼續</button><button data-command="reset">重新準備</button><button class="danger" data-command="finish">提早結束</button></section><section class="panel grid grid2"><button id="showCountdown">倒數顯示</button><button id="showClock">時間顯示</button><button id="showText">文字顯示</button><a href="/display" target="_blank"><button style="width:100%">參與者畫面</button></a></section></main><script>
const $=id=>document.getElementById(id);let state;const labels={ready:'準備完成',running:'靜心進行中',paused:'已暫停',finished:'靜心已完成'};for(const m of [3,5,7,10,15,20]){const b=document.createElement('button');b.className='preset';b.dataset.minutes=m;b.textContent=m+' 分鐘';b.onclick=()=>api('/api/duration?minutes='+m);$('presets').append(b)}async function api(p){const r=await fetch(p);paint(await r.json())}function paint(s){state=s;$('remaining').textContent=s.remainingText;$('elapsed').textContent=s.elapsedText;$('status').textContent=labels[s.status];const preset=[3,5,7,10,15,20].includes(s.selectedMinutes);for(const b of document.querySelectorAll('.preset'))b.classList.toggle('selected',Number(b.dataset.minutes)===s.selectedMinutes);$('custom').classList.toggle('selected',!preset);if(!preset&&document.activeElement!==$('custom'))$('custom').value=s.selectedMinutes;for(const [id,key,label] of [['showCountdown','showCountdown','倒數'],['showClock','showClock','時間'],['showText','showText','文字']]){$(id).classList.toggle('primary',s[key]);$(id).textContent=(s[key]?'隱藏':'顯示')+label}}new EventSource('/api/events').onmessage=e=>paint(JSON.parse(e.data));fetch('/api/state').then(r=>r.json()).then(paint);for(const b of document.querySelectorAll('[data-command]'))b.onclick=()=>api('/api/'+b.dataset.command);$('set').onclick=()=>api('/api/duration?minutes='+Number($('custom').value));$('showCountdown').onclick=()=>api('/api/toggle-countdown');$('showClock').onclick=()=>api('/api/toggle-clock');$('showText').onclick=()=>api('/api/toggle-text')
</script></body></html>
