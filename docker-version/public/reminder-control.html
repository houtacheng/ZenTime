<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZenTime 提醒控制台</title><link rel="stylesheet" href="common.css"></head><body><main class="wrap"><header class="center"><h1>時間提醒控制台</h1><div class="links"><a href="/host">靜心主持台</a><a href="/reminder" target="_blank">開啟提醒顯示畫面</a></div><div class="grid grid3 reminder-stats"><div><span class="muted">狀態</span><strong id="rStatus">未開始</strong></div><div><span class="muted">已進行</span><strong id="rElapsed">00:00</strong></div><div><span class="muted">下次提醒</span><strong id="rNext">--:--</strong></div></div></header>
<section class="panel">
<h2>定時提醒</h2>
<label class="enable-row"><input id="timedEnabled" class="reminder-enable" type="checkbox"> 啟用定時提醒浮動視窗</label>
<div class="grid grid2"><label><input id="boundToMeditation" type="checkbox"> 綁定靜心倒數</label><label><input id="manualResetsInterval" type="checkbox"> 中途提醒後重算間隔</label></div><div class="grid grid3"><div class="field"><label>固定間隔</label><select id="intervalPreset"><option value="5">5 分鐘</option><option value="10">10 分鐘</option><option value="15">15 分鐘</option><option value="30">30 分鐘</option><option value="custom">自訂</option></select></div><div class="field"><label>自訂分鐘</label><input id="intervalMinutes" type="number" min="1" max="1440"></div><div class="field"><label>提示時長（秒）</label><input id="durationSeconds" type="number" min="1" max="300"></div></div><div class="grid grid3"><div class="field"><label>淡入秒數</label><input id="fadeInSeconds" type="number" min="0" max="60"></div><div class="field"><label>淡出秒數</label><input id="fadeOutSeconds" type="number" min="0" max="60"></div><div class="field"><label>提示效果</label><select id="effect"><option value="blink">文字閃爍</option><option value="blinkZoom">文字閃爍＋放大</option><option value="red">閃爍＋放大＋全畫面底色</option></select></div></div><div class="grid grid2"><div class="field"><label>提醒文字</label><input id="rText"></div><div class="field"><label>時間格式</label><select id="timeFormat"><option value="minutes">全部顯示為分鐘</option><option value="hours">超過 60 分鐘顯示小時＋分鐘</option></select></div></div><div class="grid grid3"><label><input id="showTime" type="checkbox"> 顯示時間</label><label><input id="sameLine" type="checkbox"> 文字與時間同一行</label><div class="field"><label>文字間距</label><input id="gap" type="number" min="0" max="200"></div></div>
<h3>提醒文字樣式</h3><div class="grid grid3"><div class="field"><label>字體</label><input id="textFont" list="fonts"></div><div class="field"><label>大小 <span id="textSizeValue" class="value"></span></label><input id="textSize" type="range" min="16" max="180" step="1"></div><div class="field"><label>顏色</label><input id="textColor" type="color"></div><label><input id="textStroke" type="checkbox"> 描邊</label><div class="field"><label>描邊顏色</label><input id="textStrokeColor" type="color"></div><label><input id="textGlow" type="checkbox"> 光暈</label><div class="field"><label>光暈顏色</label><input id="textGlowColor" type="color"></div><div class="field"><label>光暈大小 <span id="textGlowSizeValue" class="value"></span></label><input id="textGlowSize" type="range" min="0" max="60" step="1"></div></div>
<h3>時間樣式</h3><div class="grid grid3"><div class="field"><label>字體</label><input id="timeFont" list="fonts"><datalist id="fonts"></datalist></div><div class="field"><label>大小 <span id="timeSizeValue" class="value"></span></label><input id="timeSize" type="range" min="16" max="180" step="1"></div><div class="field"><label>顏色</label><input id="timeColor" type="color"></div><label><input id="timeStroke" type="checkbox"> 描邊</label><div class="field"><label>描邊顏色</label><input id="timeStrokeColor" type="color"></div><label><input id="timeGlow" type="checkbox"> 光暈</label><div class="field"><label>光暈顏色</label><input id="timeGlowColor" type="color"></div><div class="field"><label>光暈大小 <span id="timeGlowSizeValue" class="value"></span></label><input id="timeGlowSize" type="range" min="0" max="60" step="1"></div></div><div class="row"><label>全畫面底色</label><input id="overlayColor" type="color"><label class="grow">透明度 <input id="overlayOpacity" type="range" min="0" max="1" step=".05"></label><span id="overlayValue" class="value"></span></div><button id="save" class="primary wide">即時套用設定</button><div class="grid grid3"><button id="start" class="primary">開始計時</button><button id="pause">暫停／繼續</button><button id="reset">重設</button></div><button id="trigger" class="danger wide">中途提醒</button></section>
<section class="panel">
<h2>臨時提醒</h2>
<label class="enable-row"><input id="temporaryEnabled" class="reminder-enable" type="checkbox"> 啟用臨時提醒浮動視窗</label>
<div class="grid grid3"><div class="field"><label>提醒文字</label><input id="tempText" value="請保持安靜"></div><div class="field"><label>位置</label><select id="tempPosition"><option value="top">上方</option><option value="center" selected>中央</option><option value="bottom">下方</option></select></div><div class="field"><label>顯示秒數</label><input id="tempDuration" type="number" min="1" max="300" value="8"></div></div><div class="grid grid3"><div class="field"><label>字體</label><input id="tempFont" list="fonts"></div><div class="field"><label>文字顏色</label><input id="tempColor" type="color"></div><div class="field"><label>大小 <span id="tempSizeValue" class="value"></span></label><input id="tempSize" type="range" min="16" max="240" step="1"></div></div><div class="grid grid3"><label><input id="tempStroke" type="checkbox"> 描邊</label><input id="tempStrokeColor" type="color"><label><input id="tempGlow" type="checkbox"> 光暈</label><input id="tempGlowColor" type="color"><div class="field"><label>光暈大小 <span id="tempGlowSizeValue" class="value"></span></label><input id="tempGlowSize" type="range" min="0" max="60" step="1"></div></div><div class="grid grid2"><label><input id="tempFadeIn" type="checkbox"> 開始淡入</label><div class="field"><label>淡入秒數</label><input id="tempFadeInSeconds" type="range" min="0" max="10" step=".1"></div><label><input id="tempFadeOut" type="checkbox"> 停止淡出</label><div class="field"><label>淡出秒數</label><input id="tempFadeOutSeconds" type="range" min="0" max="10" step=".1"></div></div><div class="grid grid2"><button id="tempShow">顯示</button><button id="tempHide">隱藏</button></div><div id="tempPresets" class="chips"></div></section>
<section class="panel">
<h2>跑馬燈提醒</h2>
<label class="enable-row"><input id="marqueeEnabled" class="reminder-enable" type="checkbox"> 啟用跑馬燈浮動視窗</label>
<div class="field"><label>提醒文字</label><input id="marqueeText" value="活動即將開始"></div><div class="grid grid3"><div class="field"><label>排列方式</label><select id="marqueeLayout"><option value="horizontal">橫式</option><option value="vertical">直式</option></select></div><div class="field"><label>移動方向</label><select id="marqueeDirection"></select></div><select id="marqueePosition"><option value="top">上方</option><option value="center">中央</option><option value="bottom" selected>下方</option></select></div><div class="grid grid3"><div class="field"><label>字體</label><input id="marqueeFont" list="fonts"></div><div class="field"><label>文字顏色</label><input id="marqueeColor" type="color"></div><div class="field"><label>底色</label><input id="marqueeBackground" type="color"></div></div><div class="grid grid3"><div class="field"><label>文字大小 <span id="marqueeSizeValue" class="value"></span></label><input id="marqueeSize" type="range" min="16" max="180" step="1"></div><div class="field"><label>底色透明度 <span id="marqueeOpacityValue" class="value"></span></label><input id="marqueeOpacity" type="range" min="0" max="1" step=".05"></div><div class="field"><label>速度 <span id="marqueeSpeedValue" class="value"></span></label><input id="marqueeSpeed" type="range" min="20" max="300" step="1" value="80"></div></div><div class="grid grid3"><label><input id="marqueeStroke" type="checkbox"> 描邊</label><input id="marqueeStrokeColor" type="color"><label><input id="marqueeGlow" type="checkbox"> 光暈</label><input id="marqueeGlowColor" type="color"><div class="field"><label>光暈大小 <span id="marqueeGlowSizeValue" class="value"></span></label><input id="marqueeGlowSize" type="range" min="0" max="60" step="1"></div></div><div class="grid grid2"><label><input id="marqueeFadeIn" type="checkbox"> 開始淡入</label><input id="marqueeFadeInSeconds" type="range" min="0" max="10" step=".1"><label><input id="marqueeFadeOut" type="checkbox"> 停止淡出</label><input id="marqueeFadeOutSeconds" type="range" min="0" max="10" step=".1"></div><div class="grid grid2"><button id="marqueeShow">開始／更新</button><button id="marqueeHide">停止</button></div></section>
<section class="panel">
<h2>PNG 圖片提醒</h2>
<label class="enable-row"><input id="imageEnabled" class="reminder-enable" type="checkbox"> 啟用 PNG 圖片浮動視窗</label>
<div class="row responsive"><input id="imageFile" class="grow" type="file" accept="image/png"><label>秒</label><input id="imageDuration" type="number" min="1" max="300" value="10"><select id="imageEffect"><option value="fade">淡入</option><option value="pulse">呼吸縮放</option></select></div><div class="field"><label>圖片大小 <span id="imageSizeValue" class="value"></span></label><input id="imageSize" type="range" min="5" max="100" step="1" value="30"></div><div class="grid grid2"><button id="imageShow">顯示圖片</button><button id="imageHide">隱藏圖片</button></div><button id="hideAll" class="danger wide">隱藏所有提醒</button></section></main><script src="reminder-control.js"></script></body></html>
